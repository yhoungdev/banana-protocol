[package]
name = "banana-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
blake3 = "1.8.3"
clap = { version = "4.5.54", features = ["derive"] }
colored = "3.0.0"
dialoguer = "0.12.0"
env_logger = "0.11.8"
indicatif = "0.18.3"
log = "0.4.29"
mdns-sd = "0.17.1"
memberlist = "0.7.0"
mime_guess = "2"
open = "5"
quinn = "0.11.9"
rand = "0.9.2"
ratatui = "0.30.0"
rcgen = "0.13.1"
reed-solomon-erasure = "6.0.0"
rust-embed = { version = "8", features = ["axum"] }
rustls = "0.23.36"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1.44"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
